<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="sidebar">
        <h1>Prompt Library</h1>
        <div id="statsPanel">
            <div id="statPrompts">0</div>
            <div id="statShared">0</div>
            <div id="statResults">0</div>
            <div id="statVersions">0</div>
        </div>
        <input id="searchInput" type="text" placeholder="Search prompts...">
        <div id="workspaceFilter"></div>
        <div id="categoryFilter"></div>
        <div id="promptWorkspace"></div>
        <button id="newPromptBtn">New Prompt</button>
    </div>
    <div id="editor">
        <h2 id="editorTitle">Editor</h2>
        <div id="editorMeta"></div>
        <input id="promptTitle" type="text" placeholder="Title">
        <input id="promptCategory" type="text" placeholder="Category">
        <input id="promptTags" type="text" placeholder="Tags">
        <textarea id="promptText" placeholder="Prompt text..."></textarea>
        <div id="scopeInputs">
            <input id="scopeSituation" type="text" placeholder="Situation">
            <input id="scopeContext" type="text" placeholder="Context">
            <input id="scopeObjective" type="text" placeholder="Objective">
            <input id="scopeParameters" type="text" placeholder="Parameters">
            <input id="scopeExamples" type="text" placeholder="Examples">
        </div>
        <button id="saveBtn">Save</button>
        <button id="duplicateBtn">Duplicate</button>
        <button id="shareBtn">Share</button>
    </div>
    <div id="runner">
        <h2>Runner</h2>
        <input id="runInput" type="text" placeholder="Input">
        <div id="runOutput"></div>
        <input id="runModel" type="text" placeholder="Model">
    </div>
    <div id="versions">
        <h2>Versions</h2>
        <ul id="versionsList"></ul>
    </div>
    <div id="results">
        <h2>Results</h2>
        <ul id="resultsList"></ul>
    </div>
    <div id="sharePreview"></div>
    <div id="shareStatusText"></div>
    <script src="scripts.js"></script>
</body>
</html>
